[graph]
all-features = false

[advisories]
version = 2

[licenses]
version = 2
# Every dependency must be redistributable under terms compatible with
# MIT OR Apache-2.0. A new licence is added here deliberately, in its own
# commit, with the crate that needs it named in the message.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
