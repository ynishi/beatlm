[package]
name          = "beatlm-web"
description   = "Browser host for beatlm: the synthetic workload driven from requestAnimationFrame on WebGPU, reported into the page"
publish       = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[lib]
# `cdylib` is the wasm module `wasm-bindgen` turns into the page's glue;
# `rlib` lets `cargo test` and `cargo doc` build the target-independent parts
# natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow      = { workspace = true }
beatlm      = { workspace = true }
beatlm-core = { workspace = true }
wgpu        = { workspace = true }

# Only the browser build talks to the page, so the native workspace build
# compiles none of this. The versions are the ones wgpu's WebGPU backend
# already locks; `just setup-web` installs the `wasm-bindgen` command at the
# locked version of the crate, which the two must agree on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys               = "0.3.106"
wasm-bindgen         = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys              = { version = "0.3.106", features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Location",
    "Navigator",
    "Node",
    "Performance",
    "Response",
    "Window",
] }

[lints]
workspace = true
