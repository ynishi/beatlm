[package]
name          = "beatlm-bench"
description   = "Headless benchmark for beatlm: a synthetic GPU load driven through the frame loop, reporting GPU and CPU timing"
publish       = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
license.workspace      = true
repository.workspace   = true
homepage.workspace     = true

[dependencies]
anyhow      = { workspace = true }
beatlm      = { workspace = true }
beatlm-core = { workspace = true }
beatlm-host = { workspace = true }
pollster    = { workspace = true }
# `counters` makes wgpu keep live counts of the objects it creates, which the
# `net` workload reads to check that the steady-state loop allocates nothing.
# It is enabled here and not in `beatlm`, so the library pays for no counters.
wgpu        = { workspace = true, features = ["counters"] }

[lints]
workspace = true
